services:
  fastq-pairer:
    build: .
    image: fastq-pairer:1.0.0
    ports:
      - "8000:8000"
    environment:
      # Single-file upload cap (bytes); also documented in the API.
      FASTQ_MAX_FILE_BYTES: "268435456"
      FASTQ_DATA_DIR: "/data"
      # Keep the SQLite page cache and Python-side batches small so the whole
      # process stays within the 256 MiB memory limit.
      FASTQ_SQLITE_CACHE_PAGES: "2048"
      FASTQ_INSERT_BATCH_SIZE: "512"
    volumes:
      - fastq-data:/data
    mem_limit: 256m
    mem_reservation: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  fastq-data:
